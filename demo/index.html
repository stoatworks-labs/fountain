  <body>
    <main id="demo">
      <noscript>
        <h1>Fountain</h1>
        <p>
          A musical fountain for Resolume Arena and Avenue, as two FFGL plugins:
          SW Fountain, a source that is a fountain at night lit by its own lamps,
          and SW Fountain Over, an effect that projects your clip onto the same
          fountain's water. The beat opens solenoid valves, a pump's head follows
          the music, and the water flies as jets that break into beads, and as a
          mist screen the wind tears.
        </p>
        <p>
          This demo runs the plugin's own C++, compiled to WebAssembly, and its
          shaders in your browser, so it needs JavaScript and WebGL2.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/fountain/">Project page and downloads</a></li>

          <li><a href="https://github.com/stoatworks-labs/fountain">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
